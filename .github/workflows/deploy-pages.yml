name: Publicar en GitHub Pages

# Publica el sitio (raíz del repo) en GitHub Pages en cada push a main.
# Usa "GitHub Actions" como origen de Pages; enablement lo activa si aún no lo está.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Desplegar en Pages
        id: deployment
        uses: actions/deploy-pages@v4
