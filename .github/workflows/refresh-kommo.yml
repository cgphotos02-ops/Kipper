name: Actualizar leads de Kommo

on:
  schedule:
    - cron: '0 12,16,20 * * 1-6'   # 7 a.m., 11 a.m. y 3 p.m. hora Colombia, de lunes a sábado
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-kommo
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Jalar leads de Kommo
        env:
          KOMMO_SUBDOMAIN: ${{ secrets.KOMMO_SUBDOMAIN }}
          KOMMO_TOKEN: ${{ secrets.KOMMO_TOKEN }}
        run: node scripts/refresh-kommo.js

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kommo.json
          git diff --staged --quiet || (git commit -m "Actualiza leads de Kommo [automático]" && git pull --rebase -q && git push)
